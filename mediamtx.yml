logLevel: info

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: false
rtsp: false
srt: false
moq: false

paths:
  live/stream:
    source: publisher

authInternalUsers:
  - user: any
    permissions:
      - action: read
        path: live/stream
      - action: playback
        path: live/stream
  - permissions:
      - action: publish
        path: live/stream
