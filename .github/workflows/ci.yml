name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-go.yml@main

  docker:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-docker.yml@main
    with:
      no_cache_filters: runner
      build: ${{ github.ref != 'refs/heads/main' }}

  publish:
    needs: [check, docker]
    if: github.ref == 'refs/heads/main'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: hu553in/common-things/.github/workflows/build-publish-attest-docker.yml@main
    with:
      image: ghcr.io/${{ github.repository }}
      no_cache_filters: runner
