name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Docker image
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' &&
    !inputs.publish && '-check' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-go.yml@main

  docker:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-docker.yml@main
    with:
      build_default_branch: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
      no_cache_filters: runner

  publish:
    needs: [check, docker]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name ==
      'workflow_dispatch' && inputs.publish))
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: hu553in/common-things/.github/workflows/build-publish-attest-docker.yml@main
    with:
      image: ghcr.io/${{ github.repository }}
      no_cache_filters: runner
